[project]
name = "zx50_fpu"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [ "" ]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "ARG",     # Enforces flake8-unused-arguments (ARG001, ARG002, etc.)
    "SLF",
    "C901", # McCabe cyclomatic complexity
    "SLF001", # Flags direct private access (obj._foo)
    "B009",   # Flags getattr with constant strings (getattr(obj, "_foo"))
]
ignore = [
    "E501", # Line length handled separately
]


[tool.ruff.lint.per-file-ignores]
"fpu_emu/tests/**" = ["SLF001", "C901"]
"fpu_emu/hardware/registers.py" = ["C901"] # Protected by agents.md rule 16

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
exclude = [
    "fpu_emu/hardware/registers.py",
    "fpu_emu/rom/fpu_rom_map.py",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["fpu_emu"]
extraPaths = [".", "tools"]

[tool.vulture]
exclude = [
    ".venv/",
    "fpu_emu_v1/",
]
ignore_decorators = [
    "@fpga_resource",
    "@pytest.fixture",
]
ignore_names = [
    "elapsed_seconds",
    "elapsed_us",
    "is_w64",
    "block_id",
    "sub_op",
    "CONV_U64_U32",
    "PUSH_STACK",
    "dir_*",
    "inst_*",
    "HEX_INT",
    "BIN_INT",
    "SIGNED_INT",
    "SYMBOL",
    "FLAG",
    "TABLE_NAME",
    "WIDTH_SUFFIX",
    "COMMENT",
    "comment",
    "label",
    "instruction",
    "directive",
    "statement",
    "start",
    "reg_or_imm",
    "imm_operand",
    "reg_indirect",
    "mem_addr",
    "table_ref",
    "line_eof",
    "raw_line",
    "FpuFlashOffsets",
    "FpuTables",
    "UCODE_ROM",
    "DATA_RAM",
    "*_F32",
    "*_F64",
    "*_F64_HI",
]

